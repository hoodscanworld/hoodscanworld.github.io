<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>HOODSCAN</title>
    <script>
      // GitHub Pages SPA redirect: save the path to sessionStorage and redirect to index
      var l = window.location;
      sessionStorage.redirect = l.href;
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/');
    </script>
  </head>
  <body></body>
</html>
