name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Generate per-route HTML with correct SEO meta tags
        run: |
          BASE=$(cat dist/index.html)

          make_page() {
            local dir="$1"
            local title="$2"
            local desc="$3"
            local canonical="$4"

            mkdir -p "dist/$dir"
            echo "$BASE" \
              | sed "s|<title>.*</title>|<title>$title</title>|g" \
              | sed "s|<meta name=\"description\" content=\"[^\"]*\"|<meta name=\"description\" content=\"$desc\"|g" \
              | sed "s|<link rel=\"canonical\" href=\"[^\"]*\"|<link rel=\"canonical\" href=\"$canonical\"|g" \
              | sed "s|content=\"https://hoodscan.world/\" />|content=\"$canonical\" />|g" \
              | sed "s|<meta property=\"og:title\" content=\"[^\"]*\"|<meta property=\"og:title\" content=\"$title\"|g" \
              | sed "s|<meta property=\"og:description\" content=\"[^\"]*\"|<meta property=\"og:description\" content=\"$desc\"|g" \
              > "dist/$dir/index.html"
            echo "✅ dist/$dir/index.html — $title"
          }

          make_page "about" \
            "About HOODSCAN | AI-Native Trading Intelligence Platform" \
            "Learn about HOODSCAN — open-source AI trading platform built for autonomous agents. MIT licensed, agent-first architecture, 50+ MCP tools." \
            "https://hoodscan.world/about"

          make_page "how-to" \
            "How to Use HOODSCAN | MCP Tools Setup Guide" \
            "Step-by-step guide to install and configure HOODSCAN MCP tools for AI agents. Works with Claude Code, Codex, and any MCP-compatible autonomous agent." \
            "https://hoodscan.world/how-to"

          make_page "demo" \
            "Live Demo | HOODSCAN 50+ MCP Tools Explorer" \
            "Explore all 50+ HOODSCAN MCP tools interactively. Live demo of portfolio management, real-time market scanning, options trading, and crypto tools." \
            "https://hoodscan.world/demo"

          make_page "cookies" \
            "Cookie Policy | HOODSCAN" \
            "HOODSCAN uses only essential cookies — no tracking, no analytics, no advertising. Transparent cookie policy for our AI trading platform." \
            "https://hoodscan.world/cookies"

          make_page "faq" \
            "FAQ | HOODSCAN AI Trading Intelligence" \
            "Frequently asked questions about HOODSCAN: security, supported AI agents, MCP tools, options trading, crypto, and the open-source roadmap." \
            "https://hoodscan.world/faq"

          make_page "login" \
            "Sign In | HOODSCAN" \
            "Sign in to HOODSCAN with your crypto wallet or email. Wallet-native authentication with MetaMask and Phantom support." \
            "https://hoodscan.world/login"

          make_page "privacy" \
            "Privacy Policy | HOODSCAN" \
            "HOODSCAN Privacy Policy: no server-side data storage, no analytics, no advertising. Learn how we handle your wallet address and session data." \
            "https://hoodscan.world/privacy"

          make_page "terms" \
            "Terms of Service | HOODSCAN" \
            "HOODSCAN Terms of Service: open-source MIT-licensed trading intelligence. Financial risk disclaimer, acceptable use, and limitation of liability." \
            "https://hoodscan.world/terms"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
